<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />

<head th:replace="~{fragments/header :: head}"></head>

<link rel="stylesheet" th:href="@{/css/sale.css}">

<body>
    <div th:replace="~{fragments/header :: header}"></div>
    <div class="container fade-in mt-4 mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="text-secondary">Cart</h2>
        </div>

        <div th:replace="~{fragments/message :: message}"></div>
        <!-- Invoice Link -->
        <div class="text-center py-2" id="invoice-link" th:if="${invoiceNumber}">
            You can print or download the last invoice here:
            <a id="open-invoice" class="btn btn-primary"
                th:href="@{/invoice/view/{invoiceNumber}(invoiceNumber=${invoiceNumber})}" target="_blank">
                <i class="bi bi-file-earmark-text"></i> Invoice
            </a>
        </div>

        <form id="sellingForm" th:action="@{/sale/save}" method="post">
            <input type="hidden" name="paymentMethod" id="paymentMethod" value="CASH" />

            <!-- Customer Search -->
            <div class="mb-3 position-relative">
                <label for="customerSearch" class="form-label">Customer</label>
                <div class="input-group">
                    <input type="text" id="customerSearch" class="form-control" placeholder="Type name or mobile..."
                        autocomplete="off">
                    <button type="button" id="clearCustomerBtn" class="btn btn-outline-secondary"
                        title="Clear">&times;</button>
                    <button type="button" id="addCustomerBtn" class="btn btn-outline-primary" title="Add New">+</button>
                </div>
                <input type="hidden" id="customerId" name="customerId">
                <div id="customerResults" class="list-group position-absolute w-100" style="z-index: 1000;"></div>
            </div>

            <!-- Product Search -->

            <div class="mb-3">
                <div class="search-container">
                    <label for="productSearch" class="form-label">Search Product</label>
                    <input type="text" id="productSearch" class="form-control"
                        placeholder="Type product name or code...">
                    <div id="productResults" class="list-group"></div>
                </div>
            </div>
            <div class="cart-container">
                <!-- Selected Products Table -->
                <table class="table table-bordered products-table" id="selectedProductsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Quantity</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- Cart Summary Panel -->
            <div id="cartSummary" class="mt-3 p-3 border rounded bg-light">
                <div class="row">
                    <div class="col-md-4"><strong>Total Items:</strong> <span id="totalItems">0</span></div>
                    <div class="col-md-4"><strong>Grand Total:</strong> ₹ <span id="grandTotal">0.00</span></div>
                </div>
            </div>

            <div class="text-end mt-3">
                <button type="submit" class="btn btn-primary btn-lg px-4">
                    <i class="bi bi-cart-check-fill"></i> Checkout
                </button>
            </div>
        </form>

        <!-- Customer Create Modal -->
        <div class="modal fade" id="createCustomerModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="createCustomerForm" th:action="@{/customers/create}" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                        <div class="modal-header">
                            <h5 class="modal-title">Create Customer</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="container">
                                <div class="row">
                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12"><label
                                            for="customer-firstName">First Name</label>
                                        <input type="text" name="firstName" id="customer-firstName" class="form-control"
                                            required>
                                    </div>
                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                                        <label for="customer-lastName">Last Name</label>
                                        <input type="text" name="lastName" id="customer-lastName" class="form-control">
                                    </div>
                                    <div class="col-12">
                                        <label for="customer-address">Address</label>
                                        <textarea name="address" id="customer-address" class="form-control"></textarea>
                                    </div>
                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                                        <label for="customer-postalCode">Postal Code</label>
                                        <input type="text" name="postalCode" id="customer-postalCode"
                                            class="form-control">
                                    </div>
                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                                        <label for="customer-mobile">Mobile</label>
                                        <input type="text" name="mobile" id="customer-mobile" class="form-control"
                                            required>
                                    </div>
                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12">
                                        <label for="customer-email">Email</label>
                                        <input type="email" name="email" id="customer-email" class="form-control">
                                    </div>
                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12"></div>
                                    <div class="col-lg-6 col-md-6 col-sm-12 col-xs-12"></div>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-person-check"></i> Save Customer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Order Summary Modal -->
        <div class="modal fade" id="orderSummaryModal" tabindex="-1" aria-labelledby="orderSummaryLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="orderSummaryLabel">Order Summary</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <strong>Buyer:</strong> <span id="summaryCustomerName" class="text-primary">N/A</span>
                        </div>
                        <table class="table table-bordered" id="order-summary-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Name</th>
                                    <th>Quantity</th>
                                    <th>Amount</th>
                                    <th>Sub Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Filled dynamically -->
                            </tbody>
                        </table>
                        <div class="text-end">
                            <strong>Total Items:</strong> <span id="summaryTotalItems">0</span><br>
                            <strong>Grand Total:</strong> ₹ <span id="summaryGrandTotal">0.00</span>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Edit</button>
                        <button type="button" id="confirmCheckout" class="btn btn-success">Confirm & Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Scripts -->
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/js/sale.js}"></script>
</body>

</html>
